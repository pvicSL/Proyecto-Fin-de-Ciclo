<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contraseña olvidada">
    <meta name="author" content="SMP">
    
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Google Fonts: Figtree y Poppins-->
    <link
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Link a archivo CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <title>Contraseña olvidada</title>
</head>
<body>

    <!----- CONTENEDOR PRINCIPAL ----->
    <div class="container">

        <!-- Menasje para el usuario -->
        <h1>¿Has olvidado tu contraseña?</h1>
        <p class="mb-5">No hay nada de qué preocuparse, 
            te enviaremos un mensaje para ayudarte a 
            restablecer tu contraseña.</p>
        
        <!--- FORMULARIO PARA ENVIAR ENLACE ---- 
        ----- a través del email del usuario --->
        <form action="#">

            <!-- Email -->
            <div class="mb-4">
            <label for="email-recu" class="form-label">Email</label>
            <input type="email" name="email-recu" class="form-control" placeholder="Escribe tu email" required>
            </div>

            <!-- Botón de submit que envía el enlace al email -->
            <div class="d-grid">
                <button type="submit" class="btn" id="enlace-restablecimiento">Eviar enlace de restablecimiento</button>
            </div>
        </form>
    </div>
    
</body>
</html>
