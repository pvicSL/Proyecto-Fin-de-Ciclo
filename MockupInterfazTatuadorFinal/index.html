<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de Sesión Administrador/Trabajador">
    <meta name="author" content="SMP">
    
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts: Figtree y Poppins-->
    <link
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Link a archivo CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <title>TatuSys - Iniciar Sesión</title>
</head>
<body>
    
    <!-- Contendor principal -->
    <div class="container">

        <!-- Bienvenida al usuario -->
        <h1>Bienvenido a <span class="texto-cyan">TatuSys</span></h1>
        <p class="mb-5">Inicia Sesión para continuar.</p>

        <!--------------- LOGIN: formulario -------------------
         --- inputs: email, contraseña, checkbox (recuérdame)---
         ----------- enlace (contraseña olvidada) y submit  --->
        
        <form action="#">

            <!-- Email -->
            <div class="mb-4">
                <label for="nombre-email" class="form-label">Nombre / Email</label>
                <input type="text" class="form-control" name="nombre-email" placeholder="Nombre / tatuador@gmail.com" required>
            </div>

            <!-- Contraseña -->
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>

                <!-- Envolvemos el input: password y el icono con input-group -->
                <div class="input-group">
                    <input type="password" class="form-control" name="password" id="passwordInput" placeholder="Contraseña" required>
                    
                    <!-- Botón para visualizar o no la contraseña -->
                    <button class="btn" type="button" id="visualizarPassword">

                        <!-- Icono visualizar contraseña-->
                        <i class="bi bi-eye-slash" id="toggleIcon" ></i>

                    </button>
                </div>
            </div>

            <!-- Recordar datos del usuario -->
            <div class="mb-4 d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input type="checkbox" name="recuerdame" class="form-check-input" id="">
                    <label for="recuerdame" class="form-check-label">Recuérdame</label>
                </div>

                <!-- Enlace a la página para recuperar contraseña -->
                <a href="contraseña_olvidada.html">¿Contraseña olvidada?</a>
            </div>

            <!-- Botón de submit que nos llevaría al HOME -->
            <div class="d-grid">
                <button type="submit" class="btn" id="iniciar-sesion">Iniciar Sesión</button>
            </div>
            
        </form>
    </div>

    <!-- Bootstrap Bundle - esto carga el JavaScript de Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- SCRIPT PARA CONTROLAR LA VISIBILIDAD DE LA CONTRASEÑA -->
    <script src="js/script-contraseña.js"></script>
</body>
</html>
