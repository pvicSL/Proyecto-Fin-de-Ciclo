<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página para escribir la nueva contraseña
    del usuario">
    <meta name="author" content="SMP">
    
    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Google Fonts: Figtree y Poppins-->
    <link
        href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Link a archivo CSS -->
    <link rel="stylesheet" href="css/style.css">
    <title>Restablecer Contraseña</title>
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">

        <!-- Mensaje al usuario -->
        <h1>Escribe tu nueva contraseña</h1>
        <p class="mb-5">No puedes repetir una contraseña que ya hayas usado.</p>

        <form action="#">

            <!-- Nueva contraseña -->
            <div class="mb-4">
            <label for="nueva-contraseña" class="form-label">Nueva Contraseña</label>
            <input type="text" name="nueva-contraseña" id="" class="form-control" placeholder="Nueva contraseña" required>
            </div>

            <!-- Confirmar la nueva contraseña -->
            <div class="mb-4">
                <label for="confirmar" class="form-label">Confirmar Contraseña</label>
            <input type="text" name="confirmar" id="" class="form-control" placeholder="Confirmar contraseña" required>
            </div>

            <!-- Botón de submit que confirmaría el cambio de contraseña -->
            <div class="d-grid">
                <button type="submit" class="btn" id="iniciar-sesion">Restablecer Contraseña</button>
            </div>
        </form>
    </div>
    
</body>
</html>
