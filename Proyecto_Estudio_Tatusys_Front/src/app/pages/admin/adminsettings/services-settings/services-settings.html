<div class="container contenedor-scroll mt-4 p-4 rounded shadow-sm">
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
    <h2 class="fw-bold m-0">Configuración de Tarifas</h2>
    <span *ngIf="hayCambios" class="badge bg-warning text-dark animate__animated animate__fadeIn">
      <i class="bi bi-exclamation-triangle-fill"></i> Tienes {{ cambiosPendientes.size }} cambios sin guardar
    </span>
  </div>

  <div class="card mb-5 border-0 bg-light shadow-sm">
    <div class="card-body d-flex align-items-center justify-content-between">
      <div>
        <h5 class="fw-bold m-0">Tarifa Mínima del Estudio</h5>
        <small class="text-muted">Precio base inicial para cualquier presupuesto.</small>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="input-group" style="width: 150px;">
          <input type="number" [(ngModel)]="precioBaseGlobal" class="form-control fw-bold text-success">
          <span class="input-group-text">€</span>
        </div>
        <button class="btn btn-dark btn-sm px-3" (click)="guardarPrecioBase()">Guardar</button>
      </div>
    </div>
  </div>

  <div *ngFor="let cat of serviciosConfig | keyvalue" class="mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <label class="form-label fw-bold text-uppercase text-muted m-0" style="letter-spacing: 1px;">
        {{ cat.key }}
      </label>
      <hr class="flex-grow-1 mx-3 opacity-25">
    </div>
    
    <div class="d-flex flex-wrap gap-3">
      <div *ngFor="let item of $any(cat.value)" 
           class="service-tag d-flex align-items-center shadow-sm"
           [class.border-cambio]="cambiosPendientes.has(item.idPrecio)">
        
        <input type="text" 
               [(ngModel)]="item.valor" 
               (input)="registrarCambio(item)" 
               class="tag-input-name form-control" 
               placeholder="Nombre">
        
        <div class="tag-price-container d-flex align-items-center">
          <input type="number" 
                 [(ngModel)]="item.precioAdicional" 
                 (input)="registrarCambio(item)" 
                 class="tag-input-price form-control">
          <span class="euro ms-1">€</span>
        </div>

        <button class="btn btn-danger ms-2" (click)="borrar(item.idPrecio)">
          <span>&times;</span>
        </button>
      </div>

      <button class="btn " (click)="crearServicio($any(cat.key))" title="Añadir nuevo {{cat.key}}">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-3 mt-5 p-3 bg-white sticky-bottom border-top">
    <button class="btn btn-outline-secondary rounded-pill px-4" (click)="cargarDatos()">
      Descartar cambios
    </button>
    
    <button class="btn btn-teal-confirmar rounded-pill px-5 fw-bold" 
            [disabled]="!hayCambios"
            (click)="confirmarYGuardar()">
      Confirmar y Guardar ({{ cambiosPendientes.size }})
    </button>
  </div>
</div>
