@if(staff){
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="text-subtitle m-0">
            Editar Trabajador - # {{staff.idTrabajador}}
        </h1>
        @if(hayCambios){
            <span class="badge bg-warning text-dark animate__animated animate__fadeIn">
                ⚠️ Cambios detectados sin guardar
            </span>
        }
    </div>

    <div class="contenedor-scroll container-fluid p-4 rounded shadow-sm border">

        <section class="mb-4">
            <h2 class="h5 fw-bold mb-4">Datos del Trabajador</h2>
            
            <form #staffForm="ngForm">
                <div class="row g-4">
                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">Nombre:</label>
                        <input type="text" class="form-control" name="nombre" 
                            [(ngModel)]="staff.nombre" (input)="verificarCambios()" required>
                    </div>

                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">Apellido 1:</label>
                        <input type="text" class="form-control" name="apellido1" 
                            [(ngModel)]="staff.apellido1" (input)="verificarCambios()" required>
                    </div>

                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">Apellido 2:</label>
                        <input type="text" class="form-control" name="apellido2" 
                            [(ngModel)]="staff.apellido2" (input)="verificarCambios()" required>
                    </div>

                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">DNI:</label>
                        <input type="text" class="form-control" name="dni" 
                            [(ngModel)]="staff.dni" (input)="verificarCambios()" required>
                    </div>

                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">Email:</label>
                        <input type="text" class="form-control" name="email" 
                            [(ngModel)]="staff.email" (input)="verificarCambios()" required>
                    </div>

                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">Teléfono:</label>
                        <input type="text" class="form-control" name="telefono" 
                            [(ngModel)]="staff.telefono" (input)="verificarCambios()" required>
                    </div>

                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">Nº Cuenta:</label>
                        <input type="text" class="form-control" name="numeroCuenta" 
                            [(ngModel)]="staff.numeroCuenta" (input)="verificarCambios()" required>
                    </div>

                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">Funciones:</label>
                        <select class="form-select" name="funciones" [(ngModel)]="staff.funciones" (change)="verificarCambios()">
                            <option value="CREACION">Creación</option>
                            <option value="ELIMINACION">Eliminación</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">Rol:</label>
                        <select class="form-select" name="rol" [(ngModel)]="staff.rol" (change)="verificarCambios()">
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="fw-bold small mb-1 text-uppercase text-muted">Contraseña:</label>
                        <div class="input-group">
                            <input type="text" class="form-control" name="contrasenia" 
                                [(ngModel)]="staff.contrasenia" (input)="verificarCambios()" 
                                placeholder="********" required>
                        </div>
                    </div>
                </div>


                <div class="d-flex justify-content-end mt-5 gap-3">
                    <button type="button" class="btn btn-danger px-4" (click)=" cargarDatosStaff(dniFijo)" [disabled]="!hayCambios">
                        REVERTIR CAMBIOS
                    </button>
                    <button class="btn py-2 px-5 fw-bold text-white" 
                            (click)="guardarStaff()" 
                            [disabled]="!staffForm.valid || !hayCambios">
                        {{ hayCambios ? 'ACTUALIZAR DATOS' : 'SIN CAMBIOS' }}
                    </button>
                </div>
            </form>
        </section>
    </div>
}
