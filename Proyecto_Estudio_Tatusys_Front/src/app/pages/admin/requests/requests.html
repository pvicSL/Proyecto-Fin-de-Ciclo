<div class="filter-group" *ngIf="layoutService.showParentButtons$ | async">
  <button 
    class="btn btn-secondary me-1" 
    [class.active]="filtroSeleccionado === 'pendientes'"
    (click)="cambiarFiltro('pendientes')">
    Pendientes
  </button>

  <button 
    class="btn btn-secondary me-1" 
    [class.active]="filtroSeleccionado === 'revisadas'"
    (click)="cambiarFiltro('revisadas')">
    Revisadas
  </button>
</div>

<div class="dashboard-content d-flex flex-column flex-grow-1">
   <router-outlet></router-outlet> 
</div>
