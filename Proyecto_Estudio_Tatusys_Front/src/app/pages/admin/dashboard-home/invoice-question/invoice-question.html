<div class="contenedor-scroll container-fluid p-4 rounded shadow-sm border d-flex justify-content-center align-items-center">
  <div class="card p-5 shadow-sm border-0" style="max-width: 500px;">
    <h1 class="text-subtitle m-0 fw-bold">¿Quieres crear una Factura?</h1>
    <p class="instruccion text-muted mb-4">La factura se le enviará al cliente por <strong>Email</strong>.</p>

    <div class="mb-3">
      <label class="form-label small fw-bold">DNI / NIE</label>
      <input type="text" class="form-control" [(ngModel)]="dni" placeholder="Ej: 12345678X">
    </div>
    <div class="mb-3">
      <label class="form-label small fw-bold">Dirección Fiscal</label>
      <input type="text" class="form-control" [(ngModel)]="direccion" placeholder="Calle, Número, CP...">
    </div>

    <div class="d-flex gap-2 justify-content-center">
      <button class="btn btn-danger px-4" (click)="irAlListado()" [disabled]="loading">
        No Generar
      </button>
      <button class="btn btn-dark px-4" (click)="confirmarGenerarFactura()" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        
        <span *ngIf="!loading">Generar</span>
        <span *ngIf="loading">Generando...</span>
      </button>
    </div>
  </div>
</div>
