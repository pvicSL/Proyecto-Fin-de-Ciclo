<table id="table-confirmadas" class="table table-striped table-borderless align-middle">
    <thead class="table-header">
        <tr>
            <th scope="col" class="d-none d-lg-table-cell"><h3>#</h3></th>
            <th scope="col"><h3>Nombre</h3></th>
            <th scope="col"><h3>Fecha y Hora</h3></th>
            <th scope="col" class="d-none d-lg-table-cell"><h3>Tipo</h3></th>
            <th scope="col"></th>
        </tr>
    </thead>
    <tbody class="table-body">
        
        @for (cita of citas; track cita.id; let i = $index) {
            <tr>
                <th scope="row" class="d-none d-lg-table-cell">
                    <p>{{ i + 1 }}</p> </th>
                <td><p>{{ cita.nombre }}</p></td>
                <td><p>{{ cita.fecha }}</p></td>
                <td class="d-none d-lg-table-cell"><p>{{ cita.tipo }}</p></td>
                <td class="d-flex justify-content-around align-items-center h-100">
                    <button class="btn" (click)="irAConfirmar(cita.id)">Confirmar</button>
                    <button class="btn" (click)="verDetalles(cita.id)">Ver</button>
                </td>
            </tr>
        } @empty {
            <tr>
                <td colspan="5" class="text-center p-4">
                    <p class="text-muted">No hay solicitudes pendientes por confirmar.</p>
                </td>
            </tr>
        }

    </tbody>
</table>
