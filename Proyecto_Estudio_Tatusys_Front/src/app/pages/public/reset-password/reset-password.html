<div class="d-flex align-items-center justify-content-center vh-100">
  <div class="login-card shadow-lg">
    <div class="card-body p-5">
      
      <div class="text-center mb-4">
        <h2 class="fw-bold text-uppercase tracking-wider">Tattoo Studio</h2>
        <p class="text-muted">Establecer Nueva Contraseña</p>
      </div>

      <div *ngIf="!token && !loading" class="alert alert-warning text-center">
        <i class="bi bi-exclamation-triangle"></i>
        <p class="small mb-0">El enlace de recuperación parece inválido.</p>
        <a routerLink="/forgot-password" class="btn btn-sm btn-outline-warning mt-2">Solicitar otro enlace</a>
      </div>

      <form *ngIf="token" (ngSubmit)="actualizarPassword()" #resetForm="ngForm">
        
        <div class="mb-3">
          <label class="form-label small fw-bold text-uppercase">Nueva Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0">
              <i class="bi bi-key text-muted"></i>
            </span>
            <input 
              type="password" 
              name="newPassword"
              class="form-control border-start-0" 
              placeholder="Mínimo 6 caracteres"
              [(ngModel)]="newPassword"
              required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-uppercase">Confirmar Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0">
              <i class="bi bi-shield-check text-muted"></i>
            </span>
            <input 
              type="password" 
              name="confirmPassword"
              class="form-control border-start-0" 
              placeholder="Repite tu contraseña"
              [(ngModel)]="confirmPassword"
              required>
          </div>
        </div>

        <button 
          type="submit" 
          class="btn btn-dark w-100 py-2 fw-bold text-uppercase"
          [disabled]="resetForm.invalid || loading">
          <span *ngIf="!loading">Cambiar Contraseña</span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
        </button>

      </form>

      <div *ngIf="mensaje" class="mt-4 p-2 small text-center rounded border" 
           [ngClass]="isError ? 'bg-danger-subtle text-danger border-danger' : 'bg-success-subtle text-success border-success'">
        {{ mensaje }}
      </div>
      
    </div>
  </div>
</div>
