<div class=" d-flex align-items-center justify-content-center">
  <div class="login-card shadow-lg">
    <div class="card-body p-5">
      
      <div class="text-center mb-4">
        <h2 class="fw-bold text-uppercase tracking-wider">Tattoo Studio</h2>
        <p class="text-muted">Panel de Gestión de Citas</p>
      </div>

      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        
        <div class="mb-3">
          <label for="email" class="form-label small fw-bold text-uppercase">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0">
              <i class="bi bi-envelope text-muted"></i>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email"
              class="form-control border-start-0" 
              placeholder="admin@empresa.com"
              [(ngModel)]="email"
              required
              email>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small fw-bold text-uppercase">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0">
              <i class="bi bi-lock text-muted"></i>
            </span>
            
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              name="password"
              class="form-control border-start-0 border-end-0" 
              placeholder="••••••••"
              [(ngModel)]="password"
              required>

            <button 
              class="input-group-text bg-transparent border-start-0" 
              type="button" 
              (click)="togglePassword()"
              tabindex="-1">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          class="btn btn-dark w-100 py-2 fw-bold text-uppercase"
          [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">Entrar al Panel</span>
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status"></span>
        </button>

      </form>

      <div class="text-end mt-2">
        <a routerLink="/forgot-password" class="text-decoration-none small text-secondary">
          ¿Has olvidado tu contraseña?
        </a>
      </div>

      <div class="mt-4 text-center">
        <small class="text-muted">¿Problemas con el acceso? Contacta al administrador.</small>
      </div>
      
    </div>
  </div>
</div>
