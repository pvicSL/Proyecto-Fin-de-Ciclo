<div class="d-flex align-items-center justify-content-center vh-100">
  <div class="login-card shadow-lg">
    <div class="card-body p-5">
      
      <div class="text-center mb-4">
        <h2 class="fw-bold text-uppercase tracking-wider">Tattoo Studio</h2>
        <p class="text-muted">Recuperar Acceso</p>
      </div>

      <p class="small text-muted mb-4 text-center">
        Introduce tu email de trabajador para recibir un enlace de recuperación.
      </p>

      <form (ngSubmit)="solicitarToken()" #forgotForm="ngForm">
        
        <div class="mb-4">
          <label for="email" class="form-label small fw-bold text-uppercase">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0">
              <i class="bi bi-envelope text-muted"></i>
            </span>
            <input 
              type="email" 
              id="email" 
              name="email"
              class="form-control border-start-0" 
              placeholder="trabajador@tatusys.com"
              [(ngModel)]="email"
              required
              email>
          </div>
        </div>

        <button 
          type="submit" 
          class="btn btn-dark w-100 py-2 fw-bold text-uppercase"
          [disabled]="forgotForm.invalid || loading">
          <span *ngIf="!loading">Enviar Enlace</span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm" role="status"></span>
        </button>

      </form>

      <div *ngIf="mensaje" class="mt-4 p-2 small text-center rounded border" 
           [ngClass]="isError ? 'bg-danger-subtle text-danger border-danger' : 'bg-success-subtle text-success border-success'">
        <i class="bi" [ngClass]="isError ? 'bi-exclamation-circle' : 'bi-check-circle'"></i>
        {{ mensaje }}
      </div>
      
    </div>
  </div>
</div>
