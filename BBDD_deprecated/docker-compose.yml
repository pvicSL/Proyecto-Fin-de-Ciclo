version: '3.8'

services:
  mysql:
    image: mysql:8.0
    command: --bind-address=0.0.0.0
    container_name: mysql-proyecto
    environment:
      MYSQL_ROOT_PASSWORD: 1105
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data: